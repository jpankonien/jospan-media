<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jospan Media</title>
<meta name="description" content="Jospan Media — video production by Joseph Pankonien.">

<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<meta property="og:title" content="Jospan Media">
<meta property="og:description" content="Jospan Media — video production by Joseph Pankonien.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/logo-lockup.png">

<!-- Kopik is licensed through Adobe Fonts. This kit must list the domain
     this site is served from (Adobe Fonts > Web Projects > xwe4bpb). -->
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/xwe4bpb.css">

<style>
  :root{
    --green:#73C055;
    --blue:#0078BF;
    --blue-dark:#005F99;
    --ink:#1C1C1C;
    --font: "kopik", "Trebuchet MS", "Avenir Next", -apple-system,
            BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}

  html{ -webkit-text-size-adjust:100% }

  body{
    margin:0;
    font-family:var(--font);
    background:var(--blue);
    color:var(--green);
  }

  img{max-width:100%;display:block}

  a:focus-visible,
  button:focus-visible{
    outline:3px solid #fff;
    outline-offset:3px;
  }

  .skip{
    position:absolute;left:-9999px;top:0;
    background:#fff;color:var(--ink);
    padding:12px 18px;z-index:100;
    border-radius:0 0 6px 0;
    font-size:16px;
  }
  .skip:focus{left:0}

  /* ---------- hero ---------- */

  .hero{
    position:relative;
    background:#3B4653 url("assets/banner.jpg") center/cover no-repeat;
    padding:0 24px;
    min-height:clamp(240px, 21vw, 430px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .brandbar{
    position:absolute;
    top:0;left:0;right:0;
    padding:10px 20px;
  }

  .brandbar img{
    width:auto;
    height:clamp(34px, 3.4vw, 46px);
  }

  .hero h1{
    margin:0;
    padding:56px 0 40px;
    color:var(--green);
    font-weight:400;
    font-size:clamp(34px, 5.4vw, 80px);
    line-height:1.1;
    letter-spacing:.01em;
    text-align:center;
  }

  /* ---------- call to action ---------- */

  .cta{
    background:var(--green);
    padding:34px 24px;
    text-align:center;
  }

  .cta a{
    display:inline-block;
    border-radius:5px;
    padding:15px 30px;
    color:var(--green);
    background:var(--blue);
    font-family:var(--font);
    font-size:24px;
    line-height:1.2;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:background-color .3s;
  }

  .cta a:hover{background:var(--blue-dark)}

  /* ---------- feature ---------- */

  .feature{
    background:var(--blue);
    padding:clamp(36px, 6vw, 90px) 24px;
  }

  .feature-inner{
    max-width:1280px;
    margin:0 auto;
    display:grid;
    grid-template-columns:minmax(220px, 1fr) minmax(0, 2.1fr);
    gap:clamp(24px, 4vw, 64px);
    align-items:center;
  }

  .feature h2{
    margin:0;
    color:var(--green);
    font-weight:400;
    font-size:clamp(26px, 2.6vw, 38px);
    line-height:1.35;
    text-align:center;
  }

  .video{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
    border-radius:4px;
    overflow:hidden;
  }

  .video iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }

  /* ---------- footer ---------- */

  footer{
    background:var(--green);
    padding:26px 24px;
  }

  footer p{
    margin:0;
    max-width:1280px;
    margin-inline:auto;
    color:var(--ink);
    font-size:15px;
  }

  @media (max-width:820px){
    .feature-inner{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<a class="skip" href="#main">Skip to main content</a>

<header class="hero">
  <div class="brandbar">
    <a href="/" aria-label="Jospan Media — home">
      <img src="assets/logo-stacked.png" alt="Jospan Media">
    </a>
  </div>
  <h1>JOSPAN MEDIA</h1>
</header>

<main id="main">

  <div class="cta">
    <a href="https://lol.jospan.com" target="_blank" rel="noopener">Get Pranked</a>
  </div>

  <section class="feature">
    <div class="feature-inner">
      <h2>BLR Court Reveal&nbsp;&ndash;<br>Fall 2020</h2>
      <div class="video">
        <iframe
          src="https://www.youtube-nocookie.com/embed/mi7-DgF7Jvk"
          title="Bishop Louis Reicher Basketball Court Reveal"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>
    </div>
  </section>

</main>

<footer>
  <p>&copy;2026. All Rights Reserved!</p>
</footer>

</body>
</html>
